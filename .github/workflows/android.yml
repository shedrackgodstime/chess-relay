name: Build Android debug APK

# Every push to main produces an installable debug APK, so the game can be
# play-tested on a phone without any local Android SDK. Release signing is
# deliberately not part of this workflow: it needs a private keystore, which
# must never live in the repo.
#
# Godot's docs call for OpenJDK 17 plus the Android SDK (build-tools and
# platform only; the prebuilt export templates mean no NDK/CMake needed since
# gradle_build/use_gradle_build is false in the preset).
#
# The debug keystore is generated per run from keytool using the standard
# Android debug credentials. Those are public by convention, not secrets, and
# are passed through Godot's documented GODOT_ANDROID_KEYSTORE_DEBUG_* env
# vars so nothing is committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.1 platform-tools platforms;android-35'
          cmdline-tools-version: latest

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android" builds/chess-relay-debug.apk

      # An unsigned or truncated APK exports without error but is rejected by
      # Android at install time, so verify the artifact here rather than
      # discovering it on a phone.
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=builds/chess-relay-debug.apk
          test -s "$APK" || { echo "::error::APK missing or empty"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgodot_android.so" \
            || { echo "::error::arm64 native library missing"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" \
            || { echo "::error::manifest missing"; exit 1; }
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK" | head -20
          echo "APK verified and signed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-relay-debug-apk
          path: builds/chess-relay-debug.apk
          if-no-files-found: error
