<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Chess Game Setup</title>
</head>

<body class="bg-stone-500 text-white min-h-screen w-full flex flex-col">

  <!-- ===== HEADER (exactly as you provided) ===== -->
  <header class="px-5 py-5 flex justify-between">
    <button class="ml-10">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-mic preview-icon">
        <path d="M12 19v3" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <rect x="9" y="2" width="6" height="13" rx="3" />
      </svg>
    </button>

    <div class="">
      <button class="mr-8">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-signal preview-icon">
          <path d="M2 20h.01" />
          <path d="M7 20v-4" />
          <path d="M12 20v-8" />
          <path d="M17 20V8" />
          <path d="M22 4v16" />
        </svg>
      </button>

      <button class="bg-stone-700 rounded-lg border border-stone-200 p-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-ellipsis-vertical preview-icon">
          <circle cx="12" cy="12" r="1" />
          <circle cx="12" cy="5" r="1" />
          <circle cx="12" cy="19" r="1" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="flex-1 mx-4 mb-4 bg-stone-600 rounded-xl p-6 flex flex-col gap-6">

    <!-- Players Row -->
    <div class="grid grid-cols-2 gap-8">

      <!-- Player 1 (You) -->
      <div class="bg-stone-700/80 rounded-xl border border-stone-500 p-5 flex items-center gap-5">
        <div class="bg-stone-800 rounded-lg border border-stone-400 size-20 flex items-center justify-center shrink-0">
          <svg class="size-14 text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 20a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z" />
            <path d="M16.5 18c1-2 2.5-5 2.5-9a7 7 0 0 0-7-7H6.635a1 1 0 0 0-.768 1.64L7 5l-2.32 5.802a2 2 0 0 0 .95 2.526l2.87 1.456" />
            <path d="m15 5 1.425-1.425" />
            <path d="m17 8 1.53-1.53" />
            <path d="M9.713 12.185 7 18" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <h2 class="text-xl font-semibold truncate">You</h2>
            <span class="text-xs bg-emerald-600/80 px-2 py-0.5 rounded-full">You</span>
          </div>
          <p class="text-stone-300 text-sm">Rating: 1420</p>
          <div class="mt-3 flex items-center gap-2">
            <span class="text-sm text-stone-400">Color:</span>
            <span class="bg-white text-stone-900 text-xs font-medium px-2.5 py-1 rounded">White</span>
          </div>
        </div>
      </div>

      <!-- Player 2 (Opponent) -->
      <div class="bg-stone-700/80 rounded-xl border border-stone-500 p-5 flex items-center gap-5">
        <div class="bg-stone-800 rounded-lg border border-stone-400 size-20 flex items-center justify-center shrink-0">
          <svg class="size-14 text-stone-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 20a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z" />
            <path d="M16.5 18c1-2 2.5-5 2.5-9a7 7 0 0 0-7-7H6.635a1 1 0 0 0-.768 1.64L7 5l-2.32 5.802a2 2 0 0 0 .95 2.526l2.87 1.456" />
            <path d="m15 5 1.425-1.425" />
            <path d="m17 8 1.53-1.53" />
            <path d="M9.713 12.185 7 18" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="text-xl font-semibold truncate mb-1">Opponent</h2>
          <p class="text-stone-300 text-sm">Rating: 1385</p>
          <div class="mt-3 flex items-center gap-2">
            <span class="text-sm text-stone-400">Color:</span>
            <span class="bg-stone-900 text-white text-xs font-medium px-2.5 py-1 rounded border border-stone-500">Black</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Row -->
    <div class="grid grid-cols-3 gap-6">

      <!-- Color Choice -->
      <div class="bg-stone-700/60 rounded-xl border border-stone-500 p-5">
        <h3 class="text-sm font-medium text-stone-300 mb-3">Choose Color</h3>
        <div class="flex gap-2">
          <button class="flex-1 py-2.5 rounded-lg bg-white text-stone-900 font-medium text-sm">
            White
          </button>
          <button class="flex-1 py-2.5 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">
            Black
          </button>
          <button class="flex-1 py-2.5 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">
            Random
          </button>
        </div>
      </div>

      <!-- Time Control -->
      <div class="bg-stone-700/60 rounded-xl border border-stone-500 p-5">
        <h3 class="text-sm font-medium text-stone-300 mb-3">Time Control</h3>
        <div class="grid grid-cols-3 gap-2">
          <button class="py-2 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">1 | 0</button>
          <button class="py-2 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">3 | 2</button>
          <button class="py-2 rounded-lg bg-emerald-700 border border-emerald-500 text-sm font-medium">5 | 3</button>
          <button class="py-2 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">10 | 0</button>
          <button class="py-2 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">15 | 10</button>
          <button class="py-2 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">Custom</button>
        </div>
      </div>

      <!-- Game Mode -->
      <div class="bg-stone-700/60 rounded-xl border border-stone-500 p-5">
        <h3 class="text-sm font-medium text-stone-300 mb-3">Game Mode</h3>
        <div class="flex flex-col gap-2">
          <button class="w-full py-2.5 rounded-lg bg-emerald-700 border border-emerald-500 text-sm font-medium">
            Casual
          </button>
          <button class="w-full py-2.5 rounded-lg bg-stone-800 border border-stone-500 text-sm hover:bg-stone-700">
            Ranked
          </button>
        </div>
      </div>
    </div>

    <!-- Status / Ready -->
    <div class="flex items-center justify-between bg-stone-700/40 rounded-xl border border-stone-500 px-5 py-3">
      <div class="flex items-center gap-3">
        <div class="size-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="text-sm text-stone-300">Both players are ready</span>
      </div>
      <span class="text-sm text-stone-400">5 | 3 · Casual · Standard</span>
    </div>

  </main>

  <!-- ===== FOOTER (kept structure, improved button) ===== -->
  <footer class="mx-4 mb-5 bg-stone-600 rounded-xl h-20 flex justify-end items-center px-6">
    <button class="flex gap-3 justify-center items-center bg-emerald-600 hover:bg-emerald-500 transition-colors h-11 px-8 rounded-lg font-medium text-base">
      <span>Play</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
      </svg>
    </button>
  </footer>

</body>
</html>
