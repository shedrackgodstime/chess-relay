[package]
name = "chess-relay-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
godot = { version = "0.5.5", features = ["experimental-threads", "api-4-7"] }
iroh = "1.3.0"
iroh-tickets = "1"
postcard = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }
